name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The same Postgres image as local development; tests make their own
    # docgen_test database on it.
    services:
      postgres:
        image: paradedb/paradedb:0.26.2-pg17
        env:
          POSTGRES_USER: docgen
          POSTGRES_PASSWORD: docgen
          POSTGRES_DB: docgen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docgen -d docgen"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      # The offline embedder keeps tests from downloading MiniLM; the model
      # clients are faked, so no API key or Ollama server is needed.
      - run: uv run pytest -q
        env:
          DOCGEN_EMBEDDINGS: hash
          DOCGEN_DATABASE_URL: postgresql://docgen:docgen@localhost:5432/docgen
