name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      # The offline embedder keeps tests from downloading MiniLM; the model
      # clients are faked, so no API key or Ollama server is needed.
      - run: uv run pytest -q
        env:
          DOCGEN_EMBEDDINGS: hash
